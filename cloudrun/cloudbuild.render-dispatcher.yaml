steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - cloudrun/render-dispatcher.Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/render-dispatcher:$COMMIT_SHA
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/render-dispatcher:$COMMIT_SHA
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/render-dispatcher:$COMMIT_SHA
substitutions:
  _REGION: us-east1
  _REPOSITORY: faceless48
